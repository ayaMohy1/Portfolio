<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="achBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121A2F" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <linearGradient id="goldLaurel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="neonStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA0FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>

    <filter id="achGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="380" rx="16" fill="url(#achBg)" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Orbit Rings -->
  <circle cx="250" cy="160" r="115" fill="none" stroke="#9FA0FF" stroke-width="1" stroke-dasharray="5 5" opacity="0.3" />
  <circle cx="250" cy="160" r="95" fill="#15203A" stroke="#D5E8E6" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Laurel Wreath Leaves (Left) -->
  <path d="M 195 185 C 180 165, 178 135, 190 105 C 193 115, 198 125, 202 130 C 190 135, 185 145, 195 185 Z" fill="url(#goldLaurel)" />
  <path d="M 180 150 C 168 135, 168 115, 178 95 C 182 103, 186 112, 190 116 Z" fill="url(#goldLaurel)" opacity="0.85" />
  <path d="M 205 115 C 198 100, 202 85, 215 70 C 218 80, 218 90, 218 95 Z" fill="url(#goldLaurel)" opacity="0.9" />

  <!-- Laurel Wreath Leaves (Right) -->
  <path d="M 305 185 C 320 165, 322 135, 310 105 C 307 115, 302 125, 298 130 C 310 135, 315 145, 305 185 Z" fill="url(#goldLaurel)" />
  <path d="M 320 150 C 332 135, 332 115, 322 95 C 318 103, 314 112, 310 116 Z" fill="url(#goldLaurel)" opacity="0.85" />
  <path d="M 295 115 C 302 100, 298 85, 285 70 C 282 80, 282 90, 282 95 Z" fill="url(#goldLaurel)" opacity="0.9" />

  <!-- Central Star Medal Shield -->
  <g transform="translate(250, 160)">
    <!-- Star Points -->
    <polygon points="0,-45 13,-13 45,-13 19,7 28,40 0,22 -28,40 -19,7 -45,-13 -13,-13" fill="url(#neonStar)" filter="url(#achGlow)" />
    <circle cx="0" cy="0" r="16" fill="#131B2E" stroke="#5EEAD4" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#5EEAD4">✦</text>
  </g>

  <!-- Banner Below -->
  <g transform="translate(60, 290)">
    <rect width="380" height="65" rx="10" fill="#141E34" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.3" />
    <text x="190" y="27" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#F1F5F9">Excellence in AI &amp; Engineering</text>
    <text x="190" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7BE0D0">NTI AI Diploma • High ROC-AUC ML • Multi-Class CNN</text>
  </g>
</svg>

