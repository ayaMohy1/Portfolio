<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11182A" />
      <stop offset="100%" stop-color="#090E18" />
    </linearGradient>

    <linearGradient id="edPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA0FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="edTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5E8E6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <filter id="edGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="550" height="400" rx="16" fill="url(#edBg)" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Circuit Background Pattern -->
  <g opacity="0.2">
    <path d="M 50 80 L 120 80 L 150 110 L 220 110" fill="none" stroke="#9FA0FF" stroke-width="1.5" />
    <circle cx="220" cy="110" r="4" fill="#9FA0FF" />
    <path d="M 500 300 L 440 300 L 410 270 L 350 270" fill="none" stroke="#5EEAD4" stroke-width="1.5" />
    <circle cx="350" cy="270" r="4" fill="#5EEAD4" />
    <path d="M 80 320 L 130 320 L 160 350 L 250 350" fill="none" stroke="#FF7171" stroke-width="1.5" />
    <circle cx="250" cy="350" r="4" fill="#FF7171" />
  </g>

  <!-- Glowing Emblem Ring -->
  <circle cx="275" cy="180" r="110" fill="none" stroke="#9FA0FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="275" cy="180" r="95" fill="#131C32" stroke="#D5E8E6" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Graduation Cap (Mortarboard) -->
  <g transform="translate(275, 160)">
    <!-- Cap Diamond Top -->
    <polygon points="0,-45 75,-15 0,15 -75,-15" fill="url(#edPrimary)" filter="url(#edGlow)" />
    <!-- Cap Under Skullcap -->
    <path d="M -40,-3 C -40,25 40,25 40,-3 Z" fill="#1A243D" stroke="#D5E8E6" stroke-width="1.5" />
    <!-- Tassel Button & Cord -->
    <circle cx="0" cy="-15" r="4" fill="#FF7171" />
    <path d="M 0,-15 C 25,-12 55,0 60,18" fill="none" stroke="#FF7171" stroke-width="2" />
    <rect x="56" y="18" width="8" height="14" rx="2" fill="#FF7171" />
  </g>

  <!-- Engineering Gear Behind Cap -->
  <g transform="translate(275, 180)" opacity="0.25">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#D5E8E6" stroke-width="6" stroke-dasharray="14 12" />
  </g>

  <!-- Academic Banner Ribbon -->
  <g transform="translate(75, 295)">
    <rect width="400" height="75" rx="12" fill="#141E34" stroke="#9FA0FF" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="200" y="28" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Faculty of Engineering</text>
    <text x="200" y="47" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#7BE0D0">Information &amp; Computer Engineering</text>
    <text x="200" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Bachelor's Degree in Engineering (B.Sc.)</text>
  </g>

  <!-- Side Floating Micro-Badges -->
  <g transform="translate(60, 110)">
    <rect width="115" height="28" rx="14" fill="#0E1628" stroke="#9FA0FF" stroke-width="1" stroke-opacity="0.5" />
    <text x="57" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9FA0FF">⚙️ Computer Eng</text>
  </g>

  <g transform="translate(375, 110)">
    <rect width="115" height="28" rx="14" fill="#0E1628" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.5" />
    <text x="57" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#5EEAD4">🧠 Systems &amp; AI</text>
  </g>
</svg>

