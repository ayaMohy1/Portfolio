<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11182B" />
      <stop offset="100%" stop-color="#080C16" />
    </linearGradient>

    <linearGradient id="trackAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA0FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>

    <linearGradient id="trackFE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41B883" />
      <stop offset="100%" stop-color="#35495E" />
    </linearGradient>

    <filter id="expGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="420" rx="16" fill="url(#expBg)" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Title -->
  <text x="35" y="42" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">Technical Evolution &amp; Practical Experience</text>
  <text x="35" y="62" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">From robust Software &amp; Frontend engineering to modern AI and Machine Learning solutions</text>

  <!-- Track 1: AI & ML Training – NTI (Diploma) -->
  <g transform="translate(35, 90)">
    <rect width="530" height="135" rx="12" fill="#131C32" stroke="#9FA0FF" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Left Icon Block -->
    <rect x="20" y="24" width="55" height="55" rx="10" fill="url(#trackAI)" filter="url(#expGlow)" />
    <text x="47.5" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24">🤖</text>

    <!-- Content -->
    <text x="92" y="38" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">AI &amp; Machine Learning Training — NTI</text>
    <text x="92" y="56" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#9FA0FF">AI for Business Diploma (National Telecommunication Institute)</text>
    <text x="92" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">Intensive applied training in Machine Learning, Deep Learning, Data Science, and practical AI applications.</text>
    
    <!-- Tags -->
    <g transform="translate(92, 92)">
      <rect width="80" height="24" rx="12" fill="#1E2A48" />
      <text x="40" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D5E8E6">Scikit-learn</text>
      
      <rect x="90" y="0" width="85" height="24" rx="12" fill="#1E2A48" />
      <text x="132.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D5E8E6">TensorFlow</text>

      <rect x="185" y="0" width="85" height="24" rx="12" fill="#1E2A48" />
      <text x="227.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D5E8E6">Deep Learning</text>

      <rect x="280" y="0" width="130" height="24" rx="12" fill="#1E2A48" />
      <text x="345" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7BE0D0">Practical Business AI</text>
    </g>

    <!-- Status Chip -->
    <rect x="425" y="18" width="90" height="22" rx="11" fill="#9FA0FF" fill-opacity="0.15" />
    <text x="470" y="33" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#9FA0FF">AI SPECIALIST</text>
  </g>

  <!-- Connecting Bridge Line -->
  <line x1="285" y1="225" x2="285" y2="250" stroke="#9FA0FF" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Track 2: Previous Professional Frontend Experience -->
  <g transform="translate(35, 250)">
    <rect width="530" height="135" rx="12" fill="#131C32" stroke="#41B883" stroke-width="1.2" stroke-opacity="0.35" />

    <!-- Left Icon Block -->
    <rect x="20" y="24" width="55" height="55" rx="10" fill="#152B26" stroke="#41B883" stroke-width="1.5" />
    <text x="47.5" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="24">💻</text>

    <!-- Content -->
    <text x="92" y="38" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F1F5F9">Professional Frontend Development Experience</text>
    <text x="92" y="56" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#41B883">Supporting Technical Foundation &amp; Web Applications</text>
    <text x="92" y="74" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1">Engineered responsive interfaces, scalable client-side logic with Vue.js &amp; Vanilla JS, and enterprise UI solutions.</text>

    <!-- Tags -->
    <g transform="translate(92, 92)">
      <rect width="70" height="24" rx="12" fill="#152B26" />
      <text x="35" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#41B883">Vue.js</text>

      <rect x="80" y="0" width="85" height="24" rx="12" fill="#152B26" />
      <text x="122.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#41B883">JavaScript</text>

      <rect x="175" y="0" width="105" height="24" rx="12" fill="#152B26" />
      <text x="227.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#41B883">Responsive Web</text>

      <rect x="290" y="0" width="125" height="24" rx="12" fill="#152B26" />
      <text x="352.5" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D5E8E6">Real-World Apps</text>
    </g>

    <!-- Status Chip -->
    <rect x="420" y="18" width="95" height="22" rx="11" fill="#41B883" fill-opacity="0.15" />
    <text x="467.5" y="33" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#41B883">ENGINEERING</text>
  </g>
</svg>

