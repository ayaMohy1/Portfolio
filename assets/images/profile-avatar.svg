<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1E2746" />
      <stop offset="60%" stop-color="#0E1526" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA0FF" />
      <stop offset="100%" stop-color="#6E70FF" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5E8E6" />
      <stop offset="100%" stop-color="#7BE0D0" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7171" />
      <stop offset="100%" stop-color="#FF4365" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)" />

  <!-- Neural Constellation Orbit Rings -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#9FA0FF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#D5E8E6" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="#FF7171" stroke-width="1" stroke-dasharray="3 7" opacity="0.2" />

  <!-- Orbit Nodes -->
  <circle cx="95" cy="190" r="6" fill="#9FA0FF" filter="url(#subtleGlow)" />
  <circle cx="410" cy="180" r="5" fill="#7BE0D0" filter="url(#subtleGlow)" />
  <circle cx="160" cy="420" r="5" fill="#FF7171" filter="url(#subtleGlow)" />
  <circle cx="370" cy="380" r="7" fill="#9FA0FF" filter="url(#subtleGlow)" />

  <!-- Connecting Vector Lines -->
  <line x1="95" y1="190" x2="150" y2="230" stroke="#9FA0FF" stroke-width="1" opacity="0.3" />
  <line x1="410" y1="180" x2="350" y2="210" stroke="#7BE0D0" stroke-width="1" opacity="0.3" />
  <line x1="370" y1="380" x2="320" y2="340" stroke="#9FA0FF" stroke-width="1" opacity="0.3" />

  <!-- AI Engineer Avatar Silhouette & Cyber Tech Elements -->
  <!-- Shoulders & Coat -->
  <path d="M 120 460 C 130 380, 180 340, 250 340 C 320 340, 370 380, 380 460 Z" fill="#131B2E" stroke="#9FA0FF" stroke-width="2" opacity="0.95" />
  <path d="M 170 460 C 180 400, 215 375, 250 375 C 285 375, 320 400, 330 460 Z" fill="#1A243D" stroke="#D5E8E6" stroke-width="1.5" opacity="0.8" />
  
  <!-- Collar Line / Neck -->
  <path d="M 225 340 L 225 300 C 225 285, 275 285, 275 300 L 275 340 Z" fill="#D5E8E6" opacity="0.15" />
  
  <!-- Head Silhouette -->
  <ellipse cx="250" cy="240" rx="65" ry="75" fill="#1B2338" stroke="#9FA0FF" stroke-width="2" />

  <!-- Sleek Hair / Framing -->
  <path d="M 175 240 C 175 160, 200 140, 250 140 C 300 140, 325 160, 325 240 C 325 280, 310 310, 305 320 C 290 280, 290 220, 280 200 C 265 170, 235 170, 220 200 C 210 220, 210 280, 195 320 C 190 310, 175 280, 175 240 Z" fill="#2A3554" />

  <!-- Futuristic Smart Glasses / AI HUD Visor -->
  <path d="M 200 230 C 215 220, 240 220, 248 226 L 252 226 C 260 220, 285 220, 300 230 C 305 245, 285 255, 258 253 L 250 250 L 242 253 C 215 255, 195 245, 200 230 Z" fill="url(#primaryGrad)" opacity="0.85" filter="url(#subtleGlow)" />
  <line x1="205" y1="237" x2="242" y2="237" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="258" y1="237" x2="295" y2="237" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="225" cy="237" r="2.5" fill="#FF7171" />
  <circle cx="275" cy="237" r="2.5" fill="#7BE0D0" />

  <!-- Holographic Code / Data Stream Overlay -->
  <text x="250" y="325" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9FA0FF" letter-spacing="2" opacity="0.9">AI ENGINEER</text>

  <!-- Interactive Instruction Badge -->
  <g transform="translate(110, 420)">
    <rect width="280" height="36" rx="18" fill="#090D16" stroke="#9FA0FF" stroke-width="1.5" opacity="0.92" filter="url(#subtleGlow)" />
    <circle cx="22" cy="18" r="6" fill="#7BE0D0" />
    <circle cx="22" cy="18" r="10" fill="none" stroke="#7BE0D0" stroke-width="1" opacity="0.5" />
    <text x="40" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#F1F5F9">
      Personal Photo Placeholder
    </text>
  </g>

  <!-- Tech Floating Tags -->
  <g transform="translate(40, 110)">
    <rect width="110" height="28" rx="14" fill="#131B2E" stroke="#9FA0FF" stroke-width="1" opacity="0.85" />
    <text x="55" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#9FA0FF">⟨/⟩ PyTorch / TF</text>
  </g>

  <g transform="translate(345, 100)">
    <rect width="115" height="28" rx="14" fill="#131B2E" stroke="#7BE0D0" stroke-width="1" opacity="0.85" />
    <text x="57" y="18" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#D5E8E6">✦ Data Science</text>
  </g>
</svg>

