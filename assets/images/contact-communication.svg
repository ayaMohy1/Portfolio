<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182B" />
      <stop offset="100%" stop-color="#090D17" />
    </linearGradient>

    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FA0FF" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>

    <filter id="ctGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="550" height="420" rx="16" fill="url(#ctBg)" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- Animated-like Radio Connection Waves -->
  <circle cx="275" cy="180" r="140" fill="none" stroke="#9FA0FF" stroke-width="1" stroke-dasharray="6 6" opacity="0.2" />
  <circle cx="275" cy="180" r="105" fill="none" stroke="#5EEAD4" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.3" />
  <circle cx="275" cy="180" r="75" fill="none" stroke="#FF7171" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Center Holographic Terminal -->
  <g transform="translate(195, 110)">
    <rect width="160" height="140" rx="16" fill="#15213B" stroke="url(#ctGrad)" stroke-width="2" filter="url(#ctGlow)" />
    
    <!-- Header of terminal -->
    <rect x="0" y="0" width="160" height="30" rx="16" fill="#1C2B4C" />
    <circle cx="20" cy="15" r="4.5" fill="#FF7171" />
    <circle cx="34" cy="15" r="4.5" fill="#FBBF24" />
    <circle cx="48" cy="15" r="4.5" fill="#34D399" />
    
    <!-- Mail / Message Icon in center -->
    <path d="M 50 65 L 110 65 C 114 65, 118 69, 118 73 L 118 107 C 118 111, 114 115, 110 115 L 50 115 C 46 115, 42 111, 42 107 L 42 73 C 42 69, 46 65, 50 65 Z" fill="#111A2E" stroke="#5EEAD4" stroke-width="1.5" />
    <path d="M 42 67 L 80 92 L 118 67" fill="none" stroke="#5EEAD4" stroke-width="1.5" />
  </g>

  <!-- Left Node: Client / Project Inquiries -->
  <g transform="translate(45, 150)">
    <rect width="120" height="60" rx="10" fill="#111B30" stroke="#9FA0FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="25" cy="30" r="14" fill="#1F2C4E" />
    <text x="25" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14">🤝</text>
    <text x="50" y="27" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">Collaboration</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">AI &amp; ML Projects</text>
  </g>
  <line x1="165" y1="180" x2="195" y2="180" stroke="#9FA0FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Right Node: AI Solutions Delivered -->
  <g transform="translate(385, 150)">
    <rect width="120" height="60" rx="10" fill="#111B30" stroke="#5EEAD4" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="25" cy="30" r="14" fill="#13383B" />
    <text x="25" y="35" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14">⚡</text>
    <text x="50" y="27" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F1F5F9">AI Pipeline</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">End-to-End Build</text>
  </g>
  <line x1="355" y1="180" x2="385" y2="180" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Bottom Interactive Contact Channels -->
  <g transform="translate(55, 305)">
    <rect width="440" height="65" rx="12" fill="#141E34" stroke="#9FA0FF" stroke-width="1.2" stroke-opacity="0.3" />
    <text x="220" y="26" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">Direct Communication Channels</text>
    <text x="220" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7BE0D0">Email • LinkedIn • GitHub • Streamlit Showcase</text>
  </g>
</svg>

